<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="428" viewBox="0 0 1160 428" role="img" aria-labelledby="title desc">
  <title id="title">shadowhook architecture</title>
  <desc id="desc">public API dispatches through hook manager to active and placeholder backends</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#bdb7c6" stroke-width="1.4"/></marker></defs>
  <rect width="1160" height="428" rx="3" fill="#0a0b0e"/>
  <rect x="1" y="1" width="1158" height="426" fill="none" stroke="#2a2931"/>
  <g fill="#85828e" font-family="Consolas, monospace" font-size="12" letter-spacing="1.2"><text x="30" y="32">01 / architecture</text><text x="1130" y="32" text-anchor="end">control path · not a kernel boundary</text></g>
  <path d="M30 48H1130" stroke="#33313b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="45" y="83" width="284" height="110" rx="5" fill="#17181d" stroke="#77717e"/>
    <text x="65" y="109" fill="#a9a5ae" font-size="12" letter-spacing="2">public api</text>
    <text x="65" y="146" fill="#eeeeef" font-size="22" font-weight="600">sh_hook(…)</text>
    <text x="65" y="175" fill="#a9a5ae" font-family="Consolas, monospace" font-size="13">sh_unhook / sh_is_hooked</text>
    <rect x="437" y="83" width="284" height="110" rx="5" fill="#17181d" stroke="#77717e"/>
    <text x="457" y="109" fill="#a9a5ae" font-size="12" letter-spacing="2">dispatch + lifecycle</text>
    <text x="457" y="145" fill="#eeeeef" font-size="22" font-weight="600">hook_manager</text>
    <text x="457" y="174" fill="#a9a5ae" font-family="Consolas, monospace" font-size="13">backend registry · mutex</text>
    <rect x="829" y="83" width="284" height="110" rx="5" fill="#17181d" stroke="#77717e"/>
    <text x="849" y="109" fill="#a9a5ae" font-size="12" letter-spacing="2">result</text>
    <text x="849" y="145" fill="#eeeeef" font-size="22" font-weight="600">hook_status</text>
    <text x="849" y="174" fill="#a9a5ae" font-family="Consolas, monospace" font-size="13">original* · when available</text>
  </g>
  <g stroke="#bdb7c6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M331 138H431"/><path d="M723 138H823"/></g>
  <path d="M579 193V226 M189 226H971 M189 226V250 M579 226V250 M971 226V250" fill="none" stroke="#88818e" stroke-width="1.3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="45" y="250" width="284" height="115" rx="5" fill="#12191a" stroke="#57706c"/>
    <text x="65" y="279" fill="#9cadac" font-size="12" letter-spacing="1.5">patching</text>
    <text x="65" y="313" fill="#e7efed" font-size="20" font-weight="600">inline · iat</text>
    <text x="65" y="340" fill="#9caeaa" font-family="Consolas, monospace" font-size="13">implemented, experimental</text>
    <rect x="437" y="250" width="284" height="115" rx="5" fill="#1b171a" stroke="#7b6473"/>
    <text x="457" y="279" fill="#bda3b3" font-size="12" letter-spacing="1.5">limited / incomplete</text>
    <text x="457" y="313" fill="#f0e8ed" font-size="18" font-weight="600">vtable · veh · page</text>
    <text x="457" y="340" fill="#bda3b3" font-family="Consolas, monospace" font-size="13">dll_hollow (iat-like)</text>
    <rect x="829" y="250" width="284" height="115" rx="5" fill="#191819" stroke="#6b6768"/>
    <text x="849" y="279" fill="#b8b0b2" font-size="12" letter-spacing="1.5">stubs only</text>
    <text x="849" y="313" fill="#f0e8ed" font-size="20" font-weight="600">ept · ssdt</text>
    <text x="849" y="340" fill="#b8b0b2" font-family="Consolas, monospace" font-size="13">returns unsupported</text>
  </g>
  <g fill="#8f8b96" font-family="Consolas, monospace" font-size="12"><text x="30" y="405">all backends compile into the current user-mode static library</text><text x="1130" y="405" text-anchor="end">8 registered / 2 placeholders</text></g>
